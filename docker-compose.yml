services:
  db:
    image: pgvector/pgvector:pg15
    container_name: recommendation_db
    environment:
      - POSTGRES_USER=kimaxim
      - POSTGRES_PASSWORD=swe123
      - POSTGRES_DB=recengine
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - app-network

  redis:
    image: redis:7  
    container_name: recommendation_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network
      
  api:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: recommendation_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://kimaxim:swe123@db:5432/recengine
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app        # hot-reload during development
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data:
  redis_data: